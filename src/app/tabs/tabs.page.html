<ion-header>
  <ion-toolbar>
    <ion-title>Mobiles2</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">Cerrar sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

@if (isOnline()) {
  <div class="network-status online" role="status">En linea · datos sincronizados</div>
} @else {
  <div class="network-status offline" role="status">Sin conexion · usando datos locales</div>
}

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="mail"></ion-icon>
      <ion-label>Mensaje</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="map"></ion-icon>
      <ion-label>Seleccion de region</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="book"></ion-icon>
      <ion-label>Leyenda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <ion-icon aria-hidden="true" name="bar-chart"></ion-icon>
      <ion-label>Estadísticas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5" href="/tabs/tab5">
      <ion-icon aria-hidden="true" name="settings"></ion-icon>
      <ion-label>Administracion</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="camera" href="/tabs/camera">
      <ion-icon aria-hidden="true" name="camera"></ion-icon>
      <ion-label>Camara</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
