<ion-content class="login-content">
  <form class="login-card" (ngSubmit)="login()">
    <h1>Iniciar sesion</h1>
    <p>Ingresa tus datos para continuar</p>

    <label class="field-label" for="login-email">Correo electronico</label>
    <input
      id="login-email"
      class="native-input"
      type="email"
      name="email"
      [(ngModel)]="email"
      autocomplete="email"
      inputmode="email"
      required
    />

    <label class="field-label" for="login-password">Contrasena</label>
    <input
      id="login-password"
      class="native-input"
      type="password"
      name="password"
      [(ngModel)]="password"
      autocomplete="current-password"
      required
    />

    <ion-text color="danger" *ngIf="errorMessage()">
      <p class="error-message">{{ errorMessage() }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Validando...' : 'Entrar' }}
    </ion-button>
  </form>
</ion-content>
